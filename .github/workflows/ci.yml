name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Belleza.sln
      - name: Build
        run: dotnet build Belleza.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Belleza.sln --configuration Release --no-build
