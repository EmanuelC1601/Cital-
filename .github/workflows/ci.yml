name: CI

on:
  push:
    branches: [main, "Ema/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Citalu.sln
      - name: Build
        run: dotnet build Citalu.sln --configuration Release --no-restore
      - name: Check EF migration model
        run: dotnet ef migrations has-pending-model-changes --project src/Citalu.Infrastructure --startup-project src/Citalu.Web
      - name: Test
        run: dotnet test Citalu.sln --configuration Release --no-build
