services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Crea .env desde .env.example}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: src/Citalu.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=Citalu;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Crea .env desde .env.example};Encrypt=True;TrustServerCertificate=True"
      Application__PublicBaseUrl: ${APPLICATION_PUBLIC_BASE_URL:-http://localhost:8080}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Smtp__EnableSsl: ${EMAIL_SMTP_ENABLE_SSL:-true}
      Email__Smtp__From: ${EMAIL_SMTP_FROM:-}
      Email__Smtp__Username: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      DataProtection__KeysPath: /var/lib/citalu-keys
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - web-data-protection:/var/lib/citalu-keys

volumes:
  sqlserver-data:
  web-data-protection:
